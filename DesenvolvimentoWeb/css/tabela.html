<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Tabela Exemplo</title>
    <style>
        th {
            color: red;
        }

        ul {
            color: green;
        }
    </style>
</head>
<body>

    <table border="1" bordercolor="gray">
        <thead>
            <tr>
                <th>Título Coluna 1</th>
                <th>Título Coluna 2</th>
                <th><a href="#">Título Coluna 3 com link</a></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <ul>
                        <li>Item de lista dentro de tabela</li>
                        <li>Item de lista dentro de tabela</li>
                        <li>Item de lista dentro de tabela</li>
                    </ul>
                </td>
                <td>Conteúdo linha 1, coluna 2</td>
                <td>Conteúdo linha 1, coluna 3</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
